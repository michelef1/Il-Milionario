<script>
let playerName="";
let speechEnabled=true;
function stopSpeech(){ if("speechSynthesis" in window) speechSynthesis.cancel(); }
function speakQuestion(){
  if(!("speechSynthesis" in window)){ openModal("Voce non disponibile","Il tuo browser non mette a disposizione la lettura vocale."); return; }
  stopSpeech();
  const text = document.getElementById("question").textContent;
  const u = new SpeechSynthesisUtterance(text);
  u.lang="it-IT";
  u.rate=0.92;
  u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const it=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("it"));
  if(it) u.voice=it;
  speechSynthesis.speak(u);
}
</script>

let game={level:0,current:null,used:new Set(),helps:{fifty:true,audience:true,expert:true},won:0,locked:false};

function euro(n){return "€"+n.toLocaleString("it-IT")}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function saveScore(name,amount,level){
 const scores=JSON.parse(localStorage.getItem("milionarioScores")||"[]");
 scores.push({name:name||"Giocatore",amount,level,date:new Date().toLocaleDateString("it-IT")});
 scores.sort((a,b)=>b.amount-a.amount); localStorage.setItem("milionarioScores",JSON.stringify(scores.slice(0,20)));
}
function scoresHtml(){
 const scores=JSON.parse(localStorage.getItem("milionarioScores")||"[]");
 if(!scores.length)return '<p>Nessun punteggio ancora.</p>';
 return '<div class="score-list">'+scores.map((s,i)=>`<div class="score-row"><span><b>${escapeHtml(s.name)}</b><br><small>${s.date} · livello ${s.level}/15</small></span><strong>${euro(s.amount)}</strong></div>`).join('')+'</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function openMenu(){document.getElementById("menuModal").classList.add("show")}
function closeMenu(){document.getElementById("menuModal").classList.remove("show")}
function showGuide(){openModal("Guida del gioco",`<p><b>Obiettivo:</b> rispondi correttamente a 15 domande e prova ad arrivare a €1.000.000.</p><p><b>Aiuti:</b> 50:50 elimina due risposte; Pubblico mostra una stima dei voti; Esperto suggerisce una risposta.</p><p>Puoi fermarti in qualsiasi momento e conservare il premio raggiunto. I punteggi vengono salvati sul dispositivo.</p>`)}
function showInfo(){openModal("Info app",`<p><b>Quiz Milionario</b></p><p>App PWA ottimizzata per smartphone.</p><p>Creata da <b>Miki by ChatGPT</b>.</p><p>Le domande provengono dai PDF forniti per questo progetto.</p>`)}
function saveRecord(v){localStorage.setItem("milionarioRecord",Math.max(v,+localStorage.getItem("milionarioRecord")||0))}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function renderPrizes(){let el=document.getElementById("prizeboard");el.innerHTML=[...prizes].reverse().map((p,i)=>{let level=14-i;return `<div class="prize ${level===game.level?'current':''} ${level===4||level===9?'safe':''}"><span>${level+1}</span><span>${euro(p)}</span></div>`}).join("")}
function pickQuestion(){
  let target=Math.min(5,Math.floor(game.level/3)+1);
  let pool=questions.filter((q,i)=>!game.used.has(i)&&Math.abs(q.d-target)<=1);
  if(!pool.length) pool=questions.filter((q,i)=>!game.used.has(i));
  let idx=questions.indexOf(pool[Math.floor(Math.random()*pool.length)]);
  game.used.add(idx);game.current=questions[idx];
}
function loadQuestion(){
  game.locked=false; stopSpeech(); pickQuestion();
  document.getElementById("money").textContent=euro(prizes[game.level]);
  document.getElementById("progress").style.width=((game.level+1)/15*100)+"%";
  renderPrizes();
  document.getElementById("question").textContent=game.current.q;
  document.getElementById("status").textContent="";
  const letters=["A","B","C","D"], box=document.getElementById("answers");box.innerHTML="";
  game.current.a.forEach((x,i)=>{let b=document.createElement("button");b.className="answer";b.innerHTML=`<b>${letters[i]}</b>${x}`;b.onclick=()=>answer(i,b);box.appendChild(b)});
}
function answer(i,btn){
 if(game.locked)return;game.locked=true;
 const all=[...document.querySelectorAll(".answer")];
 all[game.current.c].classList.add("correct");
 if(i!==game.current.c){btn.classList.add("wrong");game.won=game.level>=10?prizes[9]:game.level>=4?prizes[4]:0; setTimeout(()=>finish(false),900)}
 else {game.won=prizes[game.level]; game.level++;if(game.level>=15){setTimeout(()=>finish(true),900);}else setTimeout(loadQuestion,900)}
}
function finish(win){ stopSpeech(); saveScore(playerName,game.won,Math.min(game.level,15));
 saveRecord(game.won);document.getElementById("resultTitle").textContent=win?"HAI VINTO! 🏆":"PARTITA TERMINATA";
 document.getElementById("resultAmount").textContent=euro(game.won);
 document.getElementById("resultText").textContent=(playerName?escapeHtml(playerName)+", ":"")+(win?"incredibile: hai raggiunto il milione!":"il tuo incasso è stato salvato nei punteggi.");
 show("result");
document.getElementById("record").textContent="Record: "+euro(+localStorage.getItem("milionarioRecord")||0);
}
function useFifty(){
 if(!game.helps.fifty||game.locked)return;game.helps.fifty=false;document.getElementById("fifty").disabled=true;
 let wrong=[0,1,2,3].filter(i=>i!==game.current.c);shuffle(wrong).slice(0,2).forEach(i=>document.querySelectorAll(".answer")[i].classList.add("dim"));
}
function useAudience(){
 if(!game.helps.audience||game.locked)return;game.helps.audience=false;document.getElementById("audience").disabled=true;
 let c=game.current.c, vals=[0,0,0,0];vals[c]=65+Math.floor(Math.random()*21);let rem=100-vals[c];let others=[0,1,2,3].filter(i=>i!==c);let x=Math.floor(Math.random()*(rem+1)),y=Math.floor(Math.random()*(rem-x+1));vals[others[0]]=x;vals[others[1]]=y;vals[others[2]]=rem-x-y;
 openModal("Voto del pubblico",vals.map((v,i)=>`<div style="text-align:left"><b>${"ABCD"[i]}</b> ${v}%</div><div class="bar"><i style="width:${v}%"></i></div>`).join(""));
}
function useExpert(){
 if(!game.helps.expert||game.locked)return;game.helps.expert=false;document.getElementById("expert").disabled=true;
 openModal("L'esperto pensa…",`La risposta più probabile è <strong>${"ABCD"[game.current.c]}</strong> — <em>${game.current.a[game.current.c]}</em>.`);
}
function openModal(t,b){document.getElementById("modalTitle").textContent=t;document.getElementById("modalBody").innerHTML=b;document.getElementById("modal").classList.add("show")}
document.getElementById("menuBtn").onclick=()=>openMenu();
document.getElementById("menuClose").onclick=()=>closeMenu();
document.getElementById("guideBtn").onclick=()=>{closeMenu();showGuide()};
document.getElementById("infoBtn").onclick=()=>{closeMenu();showInfo()};
document.getElementById("scoresBtn").onclick=()=>{closeMenu();openModal("Punteggi salvati",scoresHtml())};
document.getElementById("readQuestion").onclick=speakQuestion;
document.getElementById("startBtn").onclick=()=>{playerName=(document.getElementById("playerName").value||"").trim(); if(!playerName){document.getElementById("playerName").focus(); return;} game={level:0,current:null,used:new Set(),helps:{fifty:true,audience:true,expert:true},won:0,locked:false}; ["fifty","audience","expert"].forEach(x=>document.getElementById(x).disabled=false);show("game");loadQuestion()};
document.getElementById("againBtn").onclick=()=>document.getElementById("startBtn").click();
document.getElementById("homeBtn").onclick=()=>{stopSpeech();show("start");document.getElementById("record").textContent="Record: "+euro(+localStorage.getItem("milionarioRecord")||0)};
document.getElementById("resetBtn").onclick=()=>{localStorage.removeItem("milionarioRecord");document.getElementById("record").textContent="Record azzerato."};
document.getElementById("fifty").onclick=useFifty;document.getElementById("audience").onclick=useAudience;document.getElementById("expert").onclick=useExpert;
document.getElementById("modalClose").onclick=()=>{document.getElementById("modal").classList.remove("show");playSound(AUDIO.click)};
document.getElementById("walkBtn").onclick=()=>{if(!game.locked){game.locked=true;game.won=game.level?prizes[game.level-1]:0;finish(false)}};
document.getElementById("record").textContent="Record: "+euro(+localStorage.getItem("milionarioRecord")||0);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
