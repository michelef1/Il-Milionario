<style>
:root{
  --bg-deep:#050f2c;--panel:#0d2557;--panel2:#123374;--line:#2c4d8f;

  --good:#1fd98a;--bad:#ff3358;--select:#e67e22;--t:0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 50% -10%,#153e82 0,#071b40 42%,#020510 100%);color:var(--white);overflow-x:hidden}
body{display:flex;justify-content:center}
button{font:inherit}

#spotlights{position:fixed;inset:0;z-index:0;pointer-events:none;mix-blend-mode:screen;

    transparent 0deg, rgba(255,212,71,.06) 10deg, transparent 24deg,
    transparent 150deg, rgba(120,170,255,.06) 164deg, transparent 178deg,
    transparent 330deg, rgba(255,212,71,.05) 344deg, transparent 360deg);
  animation:sweep 26s linear infinite;transform-origin:50% 10%}
@keyframes sweep{to{transform:rotate(360deg)}}
#vignette{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 22%,transparent 0%,transparent 38%,rgba(0,0,3,.6) 100%);
  opacity:calc(.4 + var(--t,0)*.13)}

#app{position:relative;z-index:1;width:100%;max-width:700px;min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;flex-direction:column}
.screen{display:none;min-height:100vh;flex-direction:column}.screen.active{display:flex}
.start{justify-content:center;align-items:center;text-align:center;gap:16px}
.logo{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1c4d9b 0,#0b2c68 58%,#061431 59%);border:4px solid var(--gold);box-shadow:0 0 35px #0c66ff66, inset 0 0 20px #0008;font-size:44px;font-weight:900;color:var(--gold);animation:pulseGold 2.5s infinite}
@keyframes pulseGold{0%,100%{box-shadow:0 0 35px #0c66ff66, inset 0 0 20px #0008}50%{box-shadow:0 0 35px #0c66ff66, inset 0 0 20px #0008, 0 0 30px #ffd44766}}
h1{margin:0;font-size:clamp(30px,9vw,52px);letter-spacing:.5px;text-shadow:0 0 22px rgba(255,212,71,.35)}
.subtitle{color:var(--muted);max-width:500px}
.primary,.secondary{border:0;border-radius:16px;padding:15px 24px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(135deg,var(--gold),var(--gold-hot));color:#171100;box-shadow:0 8px 25px #ffb70033}
.secondary{background:#173665;color:white;border:1px solid #315b9e}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px}
.top .brand{font-weight:900;color:var(--gold);letter-spacing:1px}
.money{font-weight:900;font-size:19px;font-family:ui-monospace,"SF Mono",Menlo,"Cascadia Code",monospace;font-variant-numeric:tabular-nums;letter-spacing:1px;background:#03102c;padding:5px 12px;border-radius:8px;border:1px solid #1c3b74;text-shadow:0 0 8px rgba(255,212,71,.6);box-shadow:inset 0 0 10px #0009}
.lifelines{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.help{background:linear-gradient(180deg,#123873,#0b285a);border:1px solid var(--line);color:white;border-radius:14px;padding:11px 6px;font-weight:800;min-height:58px}
.help:disabled{opacity:.32}
.progress{height:7px;background:#132b52;border-radius:20px;overflow:hidden;margin:2px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-hot),var(--gold));width:0%;transition:width .4s}
.prizeboard{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:15px}
.prize{padding:7px 10px;border-radius:9px;background:#09204a;color:#aebfdd;font-weight:800;font-size:13px;display:flex;justify-content:space-between}
.prize.current{background:linear-gradient(90deg,#765b08,#bd8e10);color:#fff}
.prize.safe{border:1px solid #6d86b6}

.question{position:relative;background:linear-gradient(145deg,#102f68,#091e47);border:1px solid #31558e;border-radius:22px;padding:22px 16px;text-align:center;margin-bottom:20px;font-size:clamp(20px,5.4vw,29px);font-weight:850;line-height:1.22;
  box-shadow:0 12px 35px rgba(0,0,0,.45), 0 0 calc(14px + var(--t,0)*20px) rgba(255,212,71,calc(.35 + var(--t,0)*.25))}
.question::before{content:"";position:absolute;inset:-7px;border-radius:27px;padding:2px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 10px, transparent 10px 20px);background-size:200% 100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:calc(.32 + var(--t,0)*.2);animation:marquee calc(1.7s - var(--t,0)*.4s) linear infinite}
@keyframes marquee{to{background-position:200% 0}}

.answers{display:grid;grid-template-columns:1fr;gap:9px}
.answer{display:flex;align-items:center;gap:12px;border:1px solid #3b619d;background:#0d2a5e;color:white;border-radius:15px;padding:14px 15px;text-align:left;font-weight:750;font-size:16px;min-height:58px;cursor:pointer;transition:background 0.2s}
.answer b{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(255,212,71,.12);border:1.5px solid var(--gold);color:var(--gold);font-size:13px}
.answer.selected{background:var(--select);border-color:#f39c12;color:#fff}
.answer.correct{background:#0b754f;border-color:var(--good)}
.answer.wrong{background:#8c1832;border-color:var(--bad)}
.answer.dim{opacity:.18}
.answer.selected b,.answer.correct b,.answer.wrong b{background:rgba(255,255,255,.22);border-color:#fff;color:#fff}
.status{text-align:center;color:var(--muted);min-height:26px;padding:8px}

.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:20}
.modal.show{display:grid}
.box{width:min(500px,100%);background:#0a214c;border:1px solid #3c619c;border-radius:22px;padding:22px;text-align:center;box-shadow:0 25px 70px #0008}
.box h2{margin-top:0;color:var(--gold)}
.bar{height:22px;background:#071a38;border-radius:20px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.result{justify-content:center;align-items:center;text-align:center;gap:12px}
.result .amount{font-size:48px;color:var(--gold);font-weight:950;font-family:ui-monospace,"SF Mono",Menlo,"Cascadia Code",monospace;text-shadow:0 0 24px rgba(255,212,71,.5)}
@media(min-width:560px){.answers{grid-template-columns:1fr 1fr}.prizeboard{grid-template-columns:1fr 1fr}.question{padding:25px}}
.score-list{max-height:45vh;overflow:auto;text-align:left}
.score-row{padding:10px;border-bottom:1px solid #294b88;display:flex;justify-content:space-between;gap:10px}
@media(max-width:380px){.lifelines{gap:5px}.help{font-size:12px;padding:9px 4px}.question{font-size:19px}.answer{font-size:15px;padding:13px}}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#confetti span{position:absolute;top:-40px;animation-name:fall;animation-timing-function:ease-in;animation-fill-mode:forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg);opacity:.2}}

@media (prefers-reduced-motion: reduce){

</style>

<script>
let playerName="";
let soundEnabled=true;

// Synth Web Audio API per effetti sonori — contesto creato al primo gesto utente (fix iOS)
let audioCtx=null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playSound(type) {
  if (!soundEnabled) return;
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  const now = ctx.currentTime;

  if (type === 'click') {
    osc.frequency.setValueAtTime(440, now);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'select') {
    osc.frequency.setValueAtTime(587.33, now);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'correct') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    osc.start(now); osc.stop(now + 0.5);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.setValueAtTime(164.81, now + 0.2);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
    osc.start(now); osc.stop(now + 0.6);
  }
}

function stopSpeech(){ if("speechSynthesis" in window) speechSynthesis.cancel(); }
function speakQuestion(){
  if(!("speechSynthesis" in window)){ openModal("Voce non disponibile","Il tuo browser non mette a disposizione la lettura vocale."); return; }
  stopSpeech();
  const text = document.getElementById("question").textContent;
  const u = new SpeechSynthesisUtterance(text);
  u.lang="it-IT"; u.rate=0.92; u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const it=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("it"));
  if(it) u.voice=it;
  speechSynthesis.speak(u);
}

}

  game.used.add(idx);game.current=questions[idx];
}

  document.getElementById("status").textContent="";
  const letters=["A","B","C","D"], box=document.getElementById("answers");box.innerHTML="";
  game.current.a.forEach((x,i)=>{let b=document.createElement("button");b.className="answer";b.innerHTML=`<b>${letters[i]}</b>${x}`;b.onclick=()=>answer(i,b);box.appendChild(b)});
}
function answer(i,btn){
 if(game.locked)return;
 game.locked=true;
 playSound('select');
 btn.classList.add("selected");
 
 setTimeout(()=>{
   const all=[...document.querySelectorAll(".answer")];
   btn.classList.remove("selected");
   all[game.current.c].classList.add("correct");
   if(i!==game.current.c){
     btn.classList.add("wrong");
     playSound('wrong');
     game.won=game.level>=10?prizes[9]:game.level>=4?prizes[4]:0; 
     setTimeout(()=>finish(false),1200);
   } else {
     playSound('correct');
     game.won=prizes[game.level]; 
     game.level++;
     if(game.level>=15){
       setTimeout(()=>finish(true),1200);
     } else {
       setTimeout(loadQuestion,1200);
     }
   }
 }, 1000);
}
function celebrate(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer=document.createElement('div');layer.id='confetti';document.body.appendChild(layer);
  const emojis=['🎉','⭐','💰','✨'];
  for(let i=0;i<40;i++){
    const s=document.createElement('span');
    s.textContent=emojis[i%emojis.length];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(2.5+Math.random()*2)+'s';
    s.style.animationDelay=(Math.random()*0.6)+'s';
    s.style.fontSize=(16+Math.random()*18)+'px';
    layer.appendChild(s);
  }
  setTimeout(()=>layer.remove(),5200);
}
function finish(win){ stopSpeech(); saveScore(playerName,game.won,Math.min(game.level,15));
 saveRecord(game.won);document.getElementById("resultTitle").textContent=win?"HAI VINTO! 🏆":"PARTITA TERMINATA";
 document.getElementById("resultAmount").textContent=euro(game.won);
 document.getElementById("resultText").textContent=(playerName?escapeHtml(playerName)+", ":"")+(win?"incredibile: hai raggiunto il milione!":"il tuo incasso è stato salvato nei punteggi.");
 show("result");
 setTension(0);
 if(win) celebrate();
 document.getElementById("record").textContent="Record: "+euro(+localStorage.getItem("milionarioRecord")||0);
}
function useFifty(){
 if(!game.helps.fifty||game.locked)return;playSound('click');game.helps.fifty=false;document.getElementById("fifty").disabled=true;
 let wrong=[0,1,2,3].filter(i=>i!==game.current.c);shuffle(wrong).slice(0,2).forEach(i=>document.querySelectorAll(".answer")[i].classList.add("dim"));
}
function useAudience(){
 if(!game.helps.audience||game.locked)return;playSound('click');game.helps.audience=false;document.getElementById("audience").disabled=true;
 let c=game.current.c, vals=[0,0,0,0];vals[c]=65+Math.floor(Math.random()*21);let rem=100-vals[c];let others=[0,1,2,3].filter(i=>i!==c);let x=Math.floor(Math.random()*(rem+1)),y=Math.floor(Math.random()*(rem-x+1));vals[others[0]]=x;vals[others[1]]=y;vals[others[2]]=rem-x-y;
 openModal("Voto del pubblico",vals.map((v,i)=>`<div style="text-align:left"><b>${"ABCD"[i]}</b> ${v}%</div><div class="bar"><i style="width:${v}%"></i></div>`).join(""));
}
function useExpert(){
 if(!game.helps.expert||game.locked)return;playSound('click');game.helps.expert=false;document.getElementById("expert").disabled=true;
 openModal("L'esperto pensa…",`La risposta più probabile è <strong>${"ABCD"[game.current.c]}</strong> — <em>${game.current.a[game.current.c]}</em>.`);
}
function openModal(t,b){document.getElementById("modalTitle").textContent=t;document.getElementById("modalBody").innerHTML=b;document.getElementById("modal").classList.add("show")}

document.getElementById("audioToggleBtn").onclick=()=>{
  soundEnabled = !soundEnabled;
  document.getElementById("audioToggleBtn").textContent = soundEnabled ? "🔊" : "🔇";
};
document.getElementById("menuBtn").onclick=()=>openMenu();
document.getElementById("menuClose").onclick=()=>closeMenu();
document.getElementById("guideBtn").onclick=()=>{closeMenu();showGuide()};
document.getElementById("infoBtn").onclick=()=>{closeMenu();showInfo()};
document.getElementById("scoresBtn").onclick=()=>{closeMenu();openModal("Punteggi salvati",scoresHtml())};
document.getElementById("scoresHomeBtn").onclick=()=>{playSound('click');openModal("Punteggi salvati",scoresHtml())};
document.getElementById("readQuestion").onclick=()=>{playSound('click');speakQuestion();};
document.getElementById("playerName").addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('startBtn').click(); } });
document.getElementById("startBtn").onclick=()=>{playSound('click');playerName=(document.getElementById("playerName").value||"").trim(); if(!playerName){document.getElementById("playerName").focus(); return;} game={level:0,current:null,used:new Set(),helps:{fifty:true,audience:true,expert:true},won:0,locked:false}; ["fifty","audience","expert"].forEach(x=>document.getElementById(x).disabled=false);show("game");loadQuestion()};
document.getElementById("againBtn").onclick=()=>{playSound('click');document.getElementById("startBtn").click();};
document.getElementById("homeBtn").onclick=()=>{playSound('click');stopSpeech();setTension(0);show("start");document.getElementById("record").textContent="Record: "+euro(+localStorage.getItem("milionarioRecord")||0)};
document.getElementById("resetBtn").onclick=()=>{playSound('click');localStorage.removeItem("milionarioRecord");document.getElementById("record").textContent="Record azzerato."};
document.getElementById("fifty").onclick=useFifty;document.getElementById("audience").onclick=useAudience;document.getElementById("expert").onclick=useExpert;
document.getElementById("modalClose").onclick=()=>{playSound('click');document.getElementById("modal").classList.remove("show");};
document.getElementById("walkBtn").onclick=()=>{if(!game.locked){playSound('click');game.locked=true;game.won=game.level?prizes[game.level-1]:0;finish(false)}};
document.querySelectorAll('.modal').forEach(m=>{ m.addEventListener('click', e=>{ if(e.target===m){ playSound('click'); m.classList.remove('show'); } }); });
document.getElementById("record").textContent="Record: "+euro(+localStorage.getItem("milionarioRecord")||0);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
